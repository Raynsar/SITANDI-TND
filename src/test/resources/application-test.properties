# =========================================================
# Test profile — H2 in-memory, JWT_SECRET sudah diset
# =========================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT secret untuk test (tidak dipakai di production)
jwt.secret=dGVzdC1zZWNyZXQta2V5LXlhbmctY3VrdXAtcGFuamFuZy11bnR1ay10ZXN0aW5n

# Nonaktifkan TNDE API di test
tnde.login-url=http://localhost:9999/api/login
tnde.inbox-url=http://localhost:9999/api/inbox

# Mailtrap token dummy untuk test — tidak akan benar-benar mengirim email
mailtrap.api-token=test-mailtrap-token-dummy-untuk-testing
app.base-url=http://localhost:8080
