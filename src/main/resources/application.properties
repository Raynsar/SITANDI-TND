# =========================================================
# Konfigurasi Aplikasi - SIPENJAM Alat TU
# Isi nilai di bawah sesuai environment (jangan commit credential asli ke Git)
# =========================================================

# --- Server ---
# HANYA berlaku saat dijalankan lokal via `mvn spring-boot:run` (embedded Tomcat).
# Saat di-deploy sebagai WAR ke Tomcat eksternal, properti ini DIABAIKAN: port diatur
# <Connector> di server.xml Tomcat, dan context path ditentukan nama file WAR di folder
# webapps/ (sipenjam.war -> /sipenjam) atau <Context> di server.xml.
# Karena itu jangan set server.servlet.context-path di sini — bisa bentrok dengan
# context path milik Tomcat. Lihat README section "Deployment ke Tomcat Eksternal".
server.port=8080

# --- Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/peminjaman_alat_tu
spring.datasource.username=root
   spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Security / Session hardening ---
# Cookie session tidak bisa dibaca JavaScript (mitigasi XSS) & tidak dikirim
# lintas-situs (mitigasi CSRF). Aktifkan 'secure' bila sudah pakai HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# --- JWT (autentikasi REST API /api/v1/**) ---
# WAJIB diisi, aplikasi menolak start bila kosong. Sengaja fail-fast: key default
# atau hardcoded akan membuat siapa pun yang membaca repo bisa menempa token.
#
# Nilai diambil dari environment variable JWT_SECRET agar nilai asli TIDAK pernah
# masuk Git. Isi dengan string acak minimal 32 karakter (256-bit, syarat HS256).
# Generate: openssl rand -base64 48
#   - Lokal  : set JWT_SECRET di environment sebelum `mvn spring-boot:run`
#   - Tomcat : set di setenv.sh/setenv.bat, JANGAN ditulis di file ini
jwt.secret=${JWT_SECRET:}

# Masa berlaku access token: 1 jam. Jangan dibuat panjang — token tidak bisa
# dicabut sebelum kedaluwarsa (tidak ada blacklist), jadi token yang bocor tetap
# sah sampai exp-nya lewat.
jwt.expiration-ms=3600000

# --- TNDE API ---
# URL endpoint login TNDE
tnde.login-url=http://192.168.1.131:1323/api/login
# URL endpoint inbox TNDE
tnde.inbox-url=http://192.168.1.131:1323/api/inbox

# --- File upload (jika ada bukti/lampiran alat) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
