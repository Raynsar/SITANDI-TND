<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - SITANDI</title>

    <!-- AdminLTE 4 CSS + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" />

    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary" data-bs-theme="light">

    <div class="card shadow-sm" style="width: 100%; max-width: 440px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img th:src="@{/images/logo-tu.svg}" alt="Logo TU" class="mb-3" style="height: 48px; width: 48px;">
                <h1 class="fs-4 fw-bold mb-1">Lupa Password</h1>
                <p class="text-body-secondary small mb-0">
                    Masukkan email yang Anda daftarkan saat registrasi.
                    Link reset password akan dikirim ke email tersebut.
                </p>
            </div>

            <div id="pesanError"
                 class="alert alert-danger d-none" role="alert"></div>

            <div id="pesanSukses"
                 class="alert alert-success d-none" role="alert"></div>

            <form id="formForgotPassword" class="d-flex flex-column gap-3" novalidate>
                <div>
                    <label for="email" class="form-label small fw-medium">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="email" maxlength="100"
                           class="form-control" placeholder="contoh@email.com">
                </div>

                <button id="tombolKirim" type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-envelope me-1"></i>Kirim Link Reset
                </button>
            </form>

            <p class="text-center text-body-secondary small mt-4 mb-0">
                Sudah ingat password?
                <a th:href="@{/login}" class="text-decoration-none fw-medium">Masuk di sini</a>
            </p>
        </div>
    </div>

    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

    <script type="module">
        const form = document.getElementById('formForgotPassword');
        const pesanError = document.getElementById('pesanError');
        const pesanSukses = document.getElementById('pesanSukses');
        const tombol = document.getElementById('tombolKirim');

        function tampilkanError(teks) {
            pesanSukses.classList.add('d-none');
            pesanError.textContent = teks;
            pesanError.classList.remove('d-none');
        }

        function tampilkanSukses(teks) {
            pesanError.classList.add('d-none');
            pesanSukses.textContent = teks;
            pesanSukses.classList.remove('d-none');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            pesanError.classList.add('d-none');
            pesanSukses.classList.add('d-none');

            const email = document.getElementById('email').value.trim();
            if (!email) {
                tampilkanError('Email tidak boleh kosong.');
                return;
            }

            tombol.disabled = true;
            tombol.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Mengirim...';
            try {
                const BASE_URL = (window.APP_CONTEXT_PATH || '/') + 'api/v1/auth';
                const response = await fetch(`${BASE_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email })
                });

                if (!response.ok) {
                    const body = await response.json().catch(() => null);
                    throw new Error(body?.message || 'Gagal mengirim request reset password.');
                }

                const data = await response.json();
                tampilkanSukses(data.message || 'Link reset password telah dikirim ke email Anda.');
                form.reset();
            } catch (error) {
                tampilkanError(error.message || 'Gagal mengirim request reset password. Coba lagi.');
            } finally {
                tombol.disabled = false;
                tombol.innerHTML = '<i class="bi bi-envelope me-1"></i>Kirim Link Reset';
            }
        });
    </script>
</body>
</html>
