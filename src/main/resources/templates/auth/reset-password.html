<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SITANDI</title>

    <!-- AdminLTE 4 CSS + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" />

    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary" data-bs-theme="light">

    <div class="card shadow-sm" style="width: 100%; max-width: 440px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img th:src="@{/images/logo-tu.svg}" alt="Logo TU" class="mb-3" style="height: 48px; width: 48px;">
                <h1 class="fs-4 fw-bold mb-1">Reset Password</h1>
                <p class="text-body-secondary small mb-0">
                    Silakan masukkan password baru Anda.
                </p>
            </div>

            <div id="pesanError"
                 class="alert alert-danger d-none" role="alert"></div>

            <div id="pesanSukses"
                 class="alert alert-success d-none" role="alert"></div>

            <form id="formResetPassword" class="d-flex flex-column gap-3" novalidate>
                <div>
                    <label for="passwordBaru" class="form-label small fw-medium">Password Baru</label>
                    <input id="passwordBaru" name="passwordBaru" type="password" required autocomplete="new-password"
                           minlength="8" maxlength="72" class="form-control">
                    <div class="form-text">Minimal 8 karakter.</div>
                </div>

                <div>
                    <label for="konfirmasiPasswordBaru" class="form-label small fw-medium">Ulangi Password Baru</label>
                    <input id="konfirmasiPasswordBaru" name="konfirmasiPasswordBaru" type="password" required
                           autocomplete="new-password" minlength="8" maxlength="72" class="form-control">
                </div>

                <button id="tombolKirim" type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-key me-1"></i>Reset Password
                </button>
            </form>

            <p class="text-center text-body-secondary small mt-4 mb-0">
                <a th:href="@{/login}" class="text-decoration-none fw-medium">Kembali ke halaman Masuk</a>
            </p>
        </div>
    </div>

    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

    <script type="module">
        const form = document.getElementById('formResetPassword');
        const pesanError = document.getElementById('pesanError');
        const pesanSukses = document.getElementById('pesanSukses');
        const tombol = document.getElementById('tombolKirim');

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            tampilkanError('Token reset tidak ditemukan di URL. Silakan klik link dari email Anda.');
            form.querySelectorAll('input, button').forEach(el => el.disabled = true);
        }

        function tampilkanError(teks) {
            pesanSukses.classList.add('d-none');
            pesanError.textContent = teks;
            pesanError.classList.remove('d-none');
        }

        function tampilkanSukses(teks) {
            pesanError.classList.add('d-none');
            pesanSukses.textContent = teks;
            pesanSukses.classList.remove('d-none');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            pesanError.classList.add('d-none');
            pesanSukses.classList.add('d-none');

            const passwordBaru = document.getElementById('passwordBaru').value;
            const konfirmasiPasswordBaru = document.getElementById('konfirmasiPasswordBaru').value;

            if (passwordBaru !== konfirmasiPasswordBaru) {
                tampilkanError('Konfirmasi password tidak cocok.');
                return;
            }

            if (passwordBaru.length < 8) {
                tampilkanError('Password baru minimal 8 karakter.');
                return;
            }

            tombol.disabled = true;
            tombol.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memproses...';
            
            try {
                const BASE_URL = (window.APP_CONTEXT_PATH || '/') + 'api/v1/auth';
                const response = await fetch(`${BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ token, passwordBaru, konfirmasiPasswordBaru })
                });

                if (!response.ok) {
                    const body = await response.json().catch(() => null);
                    let errorMsg = body?.message;
                    if(body?.errors) {
                       errorMsg = Object.values(body.errors).join(', ');
                    }
                    throw new Error(errorMsg || 'Gagal mereset password.');
                }

                const data = await response.json();
                tampilkanSukses(data.message || 'Password berhasil direset. Silakan login.');
                form.reset();
                form.querySelectorAll('input, button').forEach(el => el.disabled = true);
                
                // Redirect ke halaman login setelah 3 detik
                setTimeout(() => {
                    window.location.href = (window.APP_CONTEXT_PATH || '/') + 'login';
                }, 3000);

            } catch (error) {
                tampilkanError(error.message || 'Gagal mereset password. Token mungkin tidak valid atau sudah kedaluwarsa.');
                tombol.disabled = false;
                tombol.innerHTML = '<i class="bi bi-key me-1"></i>Reset Password';
            }
        });
    </script>
</body>
</html>
