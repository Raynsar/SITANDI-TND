<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password - SIPENJAM Alat TU</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div th:replace="~{common/header :: header}"></div>

    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 w-full max-w-md mx-auto">
            <h1 class="text-xl font-bold text-slate-900 mb-1">Ganti Password</h1>
            <p class="text-sm text-slate-500 mb-6">
                Demi keamanan, Anda harus memasukkan password lama terlebih dahulu.
            </p>

            <div id="pesanError"
                 class="hidden text-sm text-red-700 bg-red-50 border border-red-100 rounded-lg px-3 py-2 mb-4"></div>
            <div id="pesanSukses"
                 class="hidden text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2 mb-4">
                Password berhasil diganti.
            </div>

            <form id="formGantiPassword" class="flex flex-col gap-4" novalidate>
                <div>
                    <label for="passwordLama" class="block text-sm font-medium text-slate-700 mb-1">Password Lama</label>
                    <input id="passwordLama" name="passwordLama" type="password" required
                           autocomplete="current-password"
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label for="passwordBaru" class="block text-sm font-medium text-slate-700 mb-1">Password Baru</label>
                    <input id="passwordBaru" name="passwordBaru" type="password" required
                           autocomplete="new-password" minlength="8" maxlength="72"
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <p class="text-xs text-slate-400 mt-1">Minimal 8 karakter.</p>
                </div>

                <div>
                    <label for="konfirmasiPasswordBaru" class="block text-sm font-medium text-slate-700 mb-1">Ulangi Password Baru</label>
                    <input id="konfirmasiPasswordBaru" name="konfirmasiPasswordBaru" type="password" required
                           autocomplete="new-password" minlength="8" maxlength="72"
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <button id="tombolSimpan" type="submit"
                        class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-sm font-medium py-2.5 rounded-lg transition-colors shadow-sm">
                    Simpan Password Baru
                </button>
            </form>
        </div>
    </main>

    <script type="module">
        const form = document.getElementById('formGantiPassword');
        const pesanError = document.getElementById('pesanError');
        const pesanSukses = document.getElementById('pesanSukses');
        const tombol = document.getElementById('tombolSimpan');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            pesanError.classList.add('hidden');
            pesanSukses.classList.add('hidden');

            const data = Object.fromEntries(new FormData(form).entries());

            if (data.passwordBaru !== data.konfirmasiPasswordBaru) {
                pesanError.textContent = 'Konfirmasi password baru tidak cocok.';
                pesanError.classList.remove('hidden');
                return;
            }

            tombol.disabled = true;
            try {
                const { authRequest } = await import(window.APP_CONTEXT_PATH + 'js/api.js');
                await authRequest('/ganti-password', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                form.reset();
                pesanSukses.classList.remove('hidden');
            } catch (error) {
                pesanError.textContent = error.message || 'Gagal mengganti password.';
                pesanError.classList.remove('hidden');
            } finally {
                tombol.disabled = false;
            }
        });
    </script>

</body>
</html>
