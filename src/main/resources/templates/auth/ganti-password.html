<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password - SIPENJAM Alat TU</title>

    <!-- AdminLTE 4 CSS + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" />

    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-wrapper d-flex flex-column" data-bs-theme="light">

    <!-- App Header -->
    <div th:replace="~{common/header :: header}"></div>

    <!-- App Main Content -->
    <main class="app-main d-flex flex-column">
        <div class="container-fluid mt-4 mb-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <!-- Card: Ganti Password -->
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">
                                <i class="bi bi-key me-1 text-warning"></i>
                                Ganti Password
                            </h3>
                        </div>
                        <div class="card-body">
                            <p class="text-body-secondary mb-4">
                                Demi keamanan, Anda harus memasukkan password lama terlebih dahulu.
                            </p>

                            <!-- Error message -->
                            <div id="pesanError"
                                 class="alert alert-danger d-none" role="alert"></div>
                            <!-- Success message -->
                            <div id="pesanSukses"
                                 class="alert alert-success d-none" role="alert">
                                <i class="bi bi-check-circle me-1"></i>
                                Password berhasil diganti.
                            </div>

                            <form id="formGantiPassword" class="d-flex flex-column gap-3" novalidate>
                                <div>
                                    <label for="passwordLama" class="form-label">Password Lama</label>
                                    <input id="passwordLama" name="passwordLama" type="password" required
                                           autocomplete="current-password" class="form-control">
                                </div>

                                <div>
                                    <label for="passwordBaru" class="form-label">Password Baru</label>
                                    <input id="passwordBaru" name="passwordBaru" type="password" required
                                           autocomplete="new-password" minlength="8" maxlength="72" class="form-control">
                                    <div class="form-text">Minimal 8 karakter.</div>
                                </div>

                                <div>
                                    <label for="konfirmasiPasswordBaru" class="form-label">Ulangi Password Baru</label>
                                    <input id="konfirmasiPasswordBaru" name="konfirmasiPasswordBaru" type="password" required
                                           autocomplete="new-password" minlength="8" maxlength="72" class="form-control">
                                </div>

                                <div class="d-flex gap-2 mt-2">
                                    <button id="tombolSimpan" type="submit" class="btn btn-primary">
                                        <i class="bi bi-floppy me-1"></i>Simpan Password Baru
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- App Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Core JS: Popper → Bootstrap → OverlayScrollbars → AdminLTE (urutan WAJIB) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

    <script type="module">
        const form = document.getElementById('formGantiPassword');
        const pesanError = document.getElementById('pesanError');
        const pesanSukses = document.getElementById('pesanSukses');
        const tombol = document.getElementById('tombolSimpan');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            pesanError.classList.add('d-none');
            pesanSukses.classList.add('d-none');

            const data = Object.fromEntries(new FormData(form).entries());

            if (data.passwordBaru !== data.konfirmasiPasswordBaru) {
                pesanError.textContent = 'Konfirmasi password baru tidak cocok.';
                pesanError.classList.remove('d-none');
                return;
            }

            tombol.disabled = true;
            try {
                const { authRequest } = await import(window.APP_CONTEXT_PATH + 'js/api.js');
                await authRequest('/ganti-password', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                form.reset();
                pesanSukses.classList.remove('d-none');
            } catch (error) {
                pesanError.textContent = error.message || 'Gagal mengganti password.';
                pesanError.classList.remove('d-none');
            } finally {
                tombol.disabled = false;
            }
        });
    </script>
</body>
</html>
