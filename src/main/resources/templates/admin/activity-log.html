<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log - SITANDI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" />
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">
    <div th:replace="~{common/header :: header}"></div>
    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <main class="app-main">
        <div class="container-fluid mt-4 mb-4">
            <h1 class="fs-2 fw-bold mb-1"><i class="bi bi-journal-text me-2 text-primary"></i>Activity Log</h1>
            <p class="text-body-secondary mb-4">Riwayat aksi penting: login, CRUD personal, hapus user, ganti/reset password.</p>

            <!-- Filter -->
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Dari Tanggal</label>
                            <input type="date" id="filterDari" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Sampai Tanggal</label>
                            <input type="date" id="filterSampai" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Jenis Aksi</label>
                            <select id="filterAksi" class="form-select form-select-sm">
                                <option value="">Semua</option>
                                <option value="LOGIN_BERHASIL">LOGIN_BERHASIL</option>
                                <option value="LOGIN_GAGAL">LOGIN_GAGAL</option>
                                <option value="CRUD_PERSONAL">CRUD_PERSONAL</option>
                                <option value="HAPUS_USER">HAPUS_USER</option>
                                <option value="GANTI_PASSWORD">GANTI_PASSWORD</option>
                                <option value="RESET_PASSWORD">RESET_PASSWORD</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button id="btnFilter" class="btn btn-primary btn-sm"><i class="bi bi-funnel me-1"></i>Filter</button>
                            <button id="btnReset" class="btn btn-outline-secondary btn-sm">Reset</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="loadingLog" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div>
            </div>
            <div id="errorLog" class="alert alert-danger d-none" role="alert">Gagal memuat activity log.</div>

            <div id="tabelLog" class="card d-none">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="fw-semibold small text-uppercase">Waktu</th>
                                <th class="fw-semibold small text-uppercase">Pengguna</th>
                                <th class="fw-semibold small text-uppercase">Aksi</th>
                                <th class="fw-semibold small text-uppercase">Deskripsi</th>
                                <th class="fw-semibold small text-uppercase">IP Address</th>
                            </tr>
                        </thead>
                        <tbody id="bodyLog"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{common/footer :: footer}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2/browser/overlayscrollbars.browser.es6.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>
<script th:src="@{/js/main.js}" type="module"></script>
<script type="module">
    var APP_CTX = window.APP_CONTEXT_PATH || '/';

    function muatLog() {
        document.getElementById('loadingLog').classList.remove('d-none');
        document.getElementById('tabelLog').classList.add('d-none');
        document.getElementById('errorLog').classList.add('d-none');

        var params = new URLSearchParams();
        var dari = document.getElementById('filterDari').value;
        var sampai = document.getElementById('filterSampai').value;
        var aksi = document.getElementById('filterAksi').value;
        if (dari) params.set('dari', dari);
        if (sampai) params.set('sampai', sampai);
        if (aksi) params.set('aksi', aksi);

        fetch(APP_CTX + 'api/v1/activity-log?' + params.toString(), {
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin'
        })
        .then(function(res) {
            if (res.status === 401) { window.location.href = APP_CTX + 'login'; return Promise.reject(); }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(rows) {
            document.getElementById('loadingLog').classList.add('d-none');
            var body = document.getElementById('bodyLog');
            body.innerHTML = '';
            if (!rows.length) {
                body.innerHTML = '<tr><td colspan="5" class="text-center text-body-secondary py-4">Tidak ada data log.</td></tr>';
            }
            rows.forEach(function(r) {
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td>' + (r.createdAt ? String(r.createdAt).replace('T', ' ').slice(0, 19) : '-') + '</td>' +
                    '<td>' + (r.pengguna || '-') + '</td>' +
                    '<td><span class="badge text-bg-secondary">' + (r.aksi || '-') + '</span></td>' +
                    '<td>' + (r.deskripsi || '-') + '</td>' +
                    '<td>' + (r.ipAddress || '-') + '</td>';
                body.appendChild(tr);
            });
            document.getElementById('tabelLog').classList.remove('d-none');
        })
        .catch(function() {
            document.getElementById('loadingLog').classList.add('d-none');
            document.getElementById('errorLog').classList.remove('d-none');
        });
    }

    document.getElementById('btnFilter').addEventListener('click', muatLog);
    document.getElementById('btnReset').addEventListener('click', function() {
        document.getElementById('filterDari').value = '';
        document.getElementById('filterSampai').value = '';
        document.getElementById('filterAksi').value = '';
        muatLog();
    });

    muatLog();
</script>
</body>
</html>
