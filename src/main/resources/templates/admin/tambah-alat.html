<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Alat - SIPENJAM Alat TU</title>
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <header th:replace="~{common/header :: header}"></header>

    <div class="flex flex-grow">
        <aside th:replace="~{common/sidebar :: sidebar}"></aside>

        <main class="flex-grow container mx-auto px-4 py-8 max-w-xl">
            <h1 class="text-2xl font-bold text-slate-900 mb-6">Tambah Alat Baru</h1>

            <form id="form-alat" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Alat</label>
                    <input type="text" id="nama" name="nama" required
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                    <select id="kategoriId" name="kategoriId"
                            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="">-- Pilih kategori --</option>
                        <option th:each="kat : ${daftarKategori}" th:value="${kat.id}" th:text="${kat.nama}">Kategori</option>
                    </select>
                    <input type="text" id="kategoriBaru" name="kategoriBaru" placeholder="atau ketik kategori baru"
                           class="mt-2 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <p class="text-xs text-slate-400 mt-1">Pilih dari daftar, atau isi kategori baru (mengabaikan pilihan di atas).</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Stok</label>
                    <input type="number" id="stok" name="stok" min="0" value="1" required
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kondisi</label>
                    <select id="kondisi" name="kondisi" required
                            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="BAIK">BAIK</option>
                        <option value="RUSAK_RINGAN">RUSAK_RINGAN</option>
                        <option value="RUSAK_BERAT">RUSAK_BERAT</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Deskripsi</label>
                    <textarea id="deskripsi" name="deskripsi" rows="3"
                              class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <div class="flex gap-3">
                    <button type="submit"
                            class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2.5 px-5 rounded-lg transition-colors shadow-sm">
                        Simpan
                    </button>
                    <a th:href="@{/admin/inventory}"
                       class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium py-2.5 px-5 rounded-lg transition-colors">
                        Batal
                    </a>
                </div>
            </form>
        </main>
    </div>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}" type="module"></script>
    <script type="module">
        const { restRequest } = await import(window.APP_CONTEXT_PATH + 'js/api.js');

        document.getElementById('form-alat').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const payload = {
                nama: form.nama.value.trim(),
                kategoriId: form.kategoriId.value ? Number(form.kategoriId.value) : null,
                kategoriBaru: form.kategoriBaru.value.trim() || null,
                stok: Number(form.stok.value),
                kondisi: form.kondisi.value,
                deskripsi: form.deskripsi.value.trim() || null
            };
            if (!payload.kategoriId && !payload.kategoriBaru) {
                alert('Pilih kategori dari daftar atau isi kategori baru.');
                return;
            }
            try {
                await restRequest('/inventaris', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                window.location.href = window.APP_CONTEXT_PATH + 'admin/inventory';
            } catch (err) {
                console.error(err);
                alert('Gagal menambah alat. Periksa input lalu coba lagi.');
            }
        });
    </script>
</body>
</html>
