<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengguna - SITANDI</title>

    <!-- AdminLTE 4 CSS + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" />

    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-wrapper d-flex flex-column" data-bs-theme="light">

    <!-- App Header -->
    <div th:replace="~{common/header :: header}"></div>

    <!-- App Layout: Sidebar + Main -->
    <div class="app-layout">
        <!-- App Sidebar -->
        <div th:replace="~{common/sidebar :: sidebar}"></div>

        <!-- App Main Content -->
        <main class="app-main d-flex flex-column">
            <div class="container-fluid mt-4 mb-4">
                <h1 class="fs-2 fw-bold mb-1">
                    <i class="bi bi-people me-2 text-primary"></i>Kelola Pengguna
                </h1>
                <p class="text-body-secondary mb-4">
                    Akun yang mendaftar sendiri harus disetujui di sini sebelum bisa masuk.
                </p>

                <div th:if="${jumlahMenungguAktivasi > 0}"
                     class="alert alert-warning d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle"></i>
                    <strong th:text="${jumlahMenungguAktivasi}">0</strong>
                    akun menunggu persetujuan Anda.
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="fw-semibold small text-uppercase">Nama</th>
                                    <th class="fw-semibold small text-uppercase">Username</th>
                                    <th class="fw-semibold small text-uppercase">Email</th>
                                    <th class="fw-semibold small text-uppercase">Role</th>
                                    <th class="fw-semibold small text-uppercase">Status</th>
                                    <th class="fw-semibold small text-uppercase">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pengguna : ${daftarPengguna}">
                                    <td th:text="${pengguna.nama}">-</td>
                                    <td class="font-monospace small" th:text="${pengguna.username}">-</td>
                                    <td class="text-body-secondary" th:text="${pengguna.email}">-</td>
                                    <td>
                                        <span th:text="${pengguna.role}"
                                              th:classappend="${pengguna.role == 'ADMIN'} ? 'badge bg-info-subtle text-info-emphasis' : 'badge bg-secondary-subtle text-secondary-emphasis'"
                                              class="badge">-</span>
                                    </td>
                                    <td>
                                        <span th:if="${pengguna.aktif}"
                                              class="badge bg-success-subtle text-success-emphasis">Aktif</span>
                                        <span th:unless="${pengguna.aktif}"
                                              class="badge bg-warning-subtle text-warning-emphasis">Menunggu</span>
                                    </td>
                                    <td>
                                        <button th:unless="${pengguna.aktif}" type="button"
                                                class="btn-aksi btn btn-success btn-sm"
                                                th:data-id="${pengguna.id}" data-aksi="aktifkan">
                                            <i class="bi bi-check-lg me-1"></i>Setujui
                                        </button>
                                        <button th:if="${pengguna.aktif}" type="button"
                                                class="btn-aksi btn btn-outline-danger btn-sm"
                                                th:data-id="${pengguna.id}" data-aksi="nonaktifkan">
                                            <i class="bi bi-x-lg me-1"></i>Nonaktifkan
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${daftarPengguna == null or daftarPengguna.isEmpty()}">
                                    <td class="text-center text-body-tertiary py-4" colspan="6">
                                        <i class="bi bi-inbox fs-4 d-block mb-1"></i>
                                        Belum ada pengguna.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- App Footer -->
            <div th:replace="~{common/footer :: footer}"></div>
        </main>
    </div>

    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

    <script th:src="@{/js/main.js}" type="module"></script>
    <script type="module">
        const { authRequest } = await import(window.APP_CONTEXT_PATH + 'js/api.js');

        document.querySelectorAll('.btn-aksi').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const { id, aksi } = btn.dataset;

                if (aksi === 'nonaktifkan'
                        && !confirm('Nonaktifkan akun ini? Pengguna tidak akan bisa masuk lagi.')) {
                    return;
                }

                btn.disabled = true;
                try {
                    // PATCH /api/v1/auth/pengguna/{id}/{aksi}
                    await authRequest(`/pengguna/${id}/${aksi}`, { method: 'PATCH' });
                    window.location.reload();
                } catch (err) {
                    alert(err.message || 'Gagal memproses akun.');
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
