<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Inventaris - SIPENJAM Alat TU</title>
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <header th:replace="~{common/header :: header}"></header>

    <div class="flex flex-grow">
        <aside th:replace="~{common/sidebar :: sidebar}"></aside>

        <main class="flex-grow container mx-auto px-4 py-8">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Manajemen Inventaris Alat</h1>
                <a th:href="@{/admin/tambah-alat}"
                   class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-lg">
                    + Tambah Alat
                </a>
            </div>

            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                        <tr>
                            <th class="px-4 py-3">Nama Alat</th>
                            <th class="px-4 py-3">Kategori</th>
                            <th class="px-4 py-3">Stok</th>
                            <th class="px-4 py-3">Kondisi</th>
                            <th class="px-4 py-3">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Satu baris per alat dari ${daftarAlat} (AdminController) -->
                        <tr th:each="alat : ${daftarAlat}" class="border-t border-slate-100">
                            <td class="px-4 py-3" th:text="${alat.nama}">-</td>
                            <td class="px-4 py-3" th:text="${alat.kategori}">-</td>
                            <td class="px-4 py-3" th:text="${alat.stok}">-</td>
                            <td class="px-4 py-3" th:text="${alat.kondisi}">-</td>
                            <td class="px-4 py-3">
                                <button type="button" class="btn-edit text-emerald-600 hover:underline text-xs font-medium"
                                        th:data-id="${alat.id}" th:data-nama="${alat.nama}"
                                        th:data-stok="${alat.stok}" th:data-kondisi="${alat.kondisi}">Edit</button>
                            </td>
                        </tr>
                        <tr th:if="${daftarAlat == null or daftarAlat.isEmpty()}" class="border-t border-slate-100">
                            <td class="px-4 py-6 text-center text-slate-400" colspan="5">Belum ada alat.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}" type="module"></script>
    <script type="module">
        const { updateStokAlat } = await import(window.APP_CONTEXT_PATH + 'js/modules/Inventaris.js');

        const KONDISI = ['BAIK', 'RUSAK_RINGAN', 'RUSAK_BERAT'];

        document.querySelectorAll('.btn-edit').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const { id, nama, stok, kondisi } = btn.dataset;

                const stokInput = prompt(`Stok baru untuk "${nama}":`, stok);
                if (stokInput === null) return;
                const stokBaru = parseInt(stokInput, 10);
                if (Number.isNaN(stokBaru) || stokBaru < 0) {
                    alert('Stok harus berupa angka >= 0.');
                    return;
                }

                const kondisiBaru = prompt(
                    `Kondisi baru untuk "${nama}" (${KONDISI.join(' / ')}):`, kondisi);
                if (kondisiBaru === null) return;
                if (!KONDISI.includes(kondisiBaru.trim().toUpperCase())) {
                    alert('Kondisi tidak valid.');
                    return;
                }

                try {
                    await updateStokAlat(id, { stok: stokBaru, kondisi: kondisiBaru.trim().toUpperCase() });
                    window.location.reload();
                } catch (err) {
                    console.error(err);
                    alert('Gagal memperbarui alat.');
                }
            });
        });
    </script>
</body>
</html>
