<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Masuk - SIPENJAM Alat TU</title>
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <header th:replace="~{common/header :: header}"></header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">
            Surat Masuk
            <span class="text-sm font-normal text-slate-500 ml-2">— Tahun <span th:text="${tahun}"></span></span>
        </h1>

        <!-- Error message -->
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
            <p class="text-sm font-medium" th:text="${error}">Error message</p>
        </div>

        <!-- Empty state -->
        <div th:if="${daftarSurat.empty and error == null}"
             class="bg-white rounded-2xl border border-slate-100 shadow-sm text-center py-16">
            <div class="text-slate-300 mb-4">
                <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                </svg>
            </div>
            <p class="text-slate-400">Belum ada surat masuk untuk tahun ini.</p>
        </div>

        <!-- Table -->
        <div th:if="${not daftarSurat.empty}"
             class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                        <tr>
                            <th class="px-4 py-3">No</th>
                            <th class="px-4 py-3">Nomor Surat</th>
                            <th class="px-4 py-3">Perihal</th>
                            <th class="px-4 py-3">Tanggal</th>
                            <th class="px-4 py-3">Pengirim</th>
                            <th class="px-4 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="surat, iter : ${daftarSurat}" class="border-t border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-3 text-slate-500" th:text="${iter.index + 1}">1</td>
                            <td class="px-4 py-3 font-medium text-slate-700" th:text="${surat.nomorSurat}">123/ABC</td>
                            <td class="px-4 py-3 text-slate-600" th:text="${surat.perihal}">Perihal surat</td>
                            <td class="px-4 py-3 text-slate-500" th:text="${surat.tanggal}">2024-01-01</td>
                            <td class="px-4 py-3 text-slate-600" th:text="${surat.pengirim}">Pengirim</td>
                            <td class="px-4 py-3">
                                <span th:text="${surat.status}"
                                      class="text-xs font-medium bg-blue-50 text-blue-700 px-2 py-1 rounded-full">
                                    Proses
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}" type="module"></script>
</body>
</html>
