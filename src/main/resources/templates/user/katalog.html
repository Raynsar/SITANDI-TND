<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Alat - SIPENJAM Alat TU</title>
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <header th:replace="~{common/header :: header}"></header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Katalog Alat Tersedia</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Satu kartu per alat dari ${daftarAlat} (KatalogController) -->
            <div th:each="alat : ${daftarAlat}" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
                <h2 class="font-semibold text-slate-900 mb-1" th:text="${alat.nama}">Nama Alat</h2>
                <p class="text-sm text-slate-500 mb-3" th:text="${alat.kategori}">Kategori</p>
                <span class="text-xs font-medium bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full"
                      th:text="${alat.stok + ' unit tersedia'}">Stok tersedia</span>
                <a th:href="@{/form-pinjam(alatId=${alat.id})}"
                   class="mt-4 block text-center bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 rounded-lg transition-colors">
                    Ajukan Peminjaman
                </a>
            </div>

            <div th:if="${daftarAlat == null or daftarAlat.isEmpty()}"
                 class="col-span-full text-center text-slate-400 py-10">
                Belum ada alat tersedia.
            </div>
        </div>
    </main>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}" type="module"></script>
</body>
</html>
