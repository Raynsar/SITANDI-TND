<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajukan Peminjaman - SIPENJAM Alat TU</title>
    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <header th:replace="~{common/header :: header}"></header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-xl">
        <h1 class="text-2xl font-bold text-slate-900 mb-6">Formulir Pengajuan Peminjaman</h1>

        <form id="form-pinjam" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 flex flex-col gap-4">
            <input type="hidden" id="alatId" name="alatId" th:value="${param.alatId}">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Pinjam</label>
                <input type="date" id="tanggalPinjam" name="tanggalPinjam" required
                       class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Kembali</label>
                <input type="date" id="tanggalKembali" name="tanggalKembali" required
                       class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Keperluan</label>
                <textarea id="keperluan" name="keperluan" rows="3" required
                          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>

            <button type="submit"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2.5 rounded-lg transition-colors shadow-sm">
                Ajukan
            </button>
        </form>
    </main>

    <footer th:replace="~{common/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}" type="module"></script>
    <script type="module">
        const { ajukanPeminjaman } = await import(window.APP_CONTEXT_PATH + 'js/modules/Peminjaman.js');

        document.getElementById('form-pinjam').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            try {
                await ajukanPeminjaman({
                    alatId: form.alatId.value,
                    tanggalPinjam: form.tanggalPinjam.value,
                    tanggalKembali: form.tanggalKembali.value,
                    keperluan: form.keperluan.value
                });
                window.location.href = window.APP_CONTEXT_PATH + 'riwayat';
            } catch (err) {
                console.error(err);
                alert('Gagal mengajukan peminjaman. Silakan coba lagi.');
            }
        });
    </script>
</body>
</html>
