<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peminjaman Alat TU</title>

    <!-- AdminLTE 4 CSS + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" />

    <th:block th:replace="~{common/context-path :: context-path}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .hero-section {
            min-height: calc(100vh - 3.5rem - 3.5rem);
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="app-wrapper d-flex flex-column bg-body-tertiary" data-bs-theme="light">

    <!-- Custom landing page header (extends AdminLTE look) -->
    <header class="app-header navbar navbar-expand-md">
        <div class="container-fluid">
            <a th:href="@{/admin/dashboard}" class="navbar-brand text-nowrap">
                <img th:src="@{/images/logo-tu.svg}" alt="Logo TU" class="d-inline-flex me-2"
                     style="height: 32px; width: 32px;">
                <span class="fw-bold fs-6 lh-1">
                    SIPENJAM <span class="text-success">ALAT TU</span>
                </span>
            </a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a th:href="@{/login}" class="nav-link">
                            <i class="bi bi-info-circle me-1"></i>Tentang Aplikasi
                        </a>
                    </li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-primary btn-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Masuk Akun
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="app-main hero-section">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6 text-center py-5">
                    <span class="badge bg-success-subtle text-success-emphasis text-uppercase small mb-3">
                        Layanan Internal Tata Usaha
                    </span>
                    <h1 class="display-5 fw-bold mb-3">Tata Naskah Dinas</h1>
                    <p class="lead text-body-secondary mb-4">
                        Sistem pengelolaan naskah dinas dan struktur organisasi secara terintegrasi.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/login}" class="btn btn-dark btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Masuk ke Aplikasi
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="d-flex flex-wrap justify-content-between align-items-center small">
            <span>&copy; 2026 SIPENJAM TU. Sistem Informasi Tata Usaha.</span>
            <span class="d-flex gap-3">
                <a href="#" class="text-body-tertiary text-decoration-none">Panduan Peminjaman</a>
                <a href="#" class="text-body-tertiary text-decoration-none">Syarat &amp; Ketentuan</a>
            </span>
        </div>
    </footer>

    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>

    <script th:src="@{/js/main.js}" type="module"></script>
</body>
</html>
