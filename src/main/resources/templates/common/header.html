<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="header" class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img th:src="@{/images/logo-tu.svg}" alt="Logo TU" class="h-8 w-8">
                <span class="text-xl font-bold tracking-tight text-slate-800">
                    SIPENJAM <span class="text-emerald-600">ALAT TU</span>
                </span>
            </div>
            <nav class="hidden md:flex items-center gap-6">
                <a th:href="@{/katalog}" class="text-sm font-medium text-slate-600 hover:text-emerald-600">Katalog Alat</a>
                <a th:href="@{/riwayat}" class="text-sm font-medium text-slate-600 hover:text-emerald-600">Riwayat Peminjaman</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/ganti-password}"
                   class="text-sm font-medium text-slate-600 hover:text-emerald-600">Ganti Password</a>
            </nav>
            <div class="flex items-center gap-4">
                <span sec:authorize="isAuthenticated()" th:text="${#authentication.name}"
                      class="text-sm text-slate-600"></span>

                <!--
                  Logout WAJIB POST, bukan link biasa.
                  Sejak proteksi CSRF diaktifkan (token pindah ke cookie), Spring Security
                  hanya melayani POST /logout — GET /logout tidak lagi cocok dengan
                  LogoutFilter dan berakhir 404. Form th:action juga otomatis diisi hidden
                  input _csrf oleh Thymeleaf, yang memang diwajibkan endpoint ini.
                  Bonus: logout lewat GET bisa dipicu paksa dari situs lain (mis. lewat
                  <img src=".../logout">), POST + CSRF menutup itu.
                -->
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit"
                            class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium py-2 px-4 rounded-lg transition-colors">
                        Keluar
                    </button>
                </form>
            </div>
        </div>
    </header>
</body>
</html>
