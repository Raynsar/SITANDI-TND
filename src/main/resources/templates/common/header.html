<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!--
      ============================================================
      AdminLTE 4 — App Header (top navigation bar)
      ============================================================
      • .app-header      — fixed top bar
      • .navbar-brand    — brand link (logo + app name)
      • #sidebarToggle   — toggle button for sidebar (data-lte-toggle="sidebar")
      ============================================================
    -->
    <header th:fragment="header" class="app-header navbar navbar-expand-md">
        <div class="container-fluid">

            <!-- Brand (logo + app name) -->
            <a th:href="@{/admin/dashboard}" class="navbar-brand text-nowrap me-auto me-md-3">
                <img th:src="@{/images/logo-tu.svg}" alt="Logo TU" class="brand-image d-inline-flex me-2"
                     style="height: 32px; width: 32px;">
                <span class="fw-bold fs-6 lh-1">
                    SITANDI <span class="text-success">TND</span>
                </span>
            </a>

            <!-- Sidebar toggle button (visible on small screens) -->
            <button class="navbar-toggler order-1" type="button"
                    data-lte-toggle="sidebar"
                    aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Top navigation links (hidden on small screens) -->
            <div class="collapse navbar-collapse order-3" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" th:if="${session != null and session.tndeToken != null}">
                        <a th:href="@{/surat-masuk}" class="nav-link">
                            <i class="bi bi-envelope me-1"></i>Surat Masuk
                        </a>
                    </li>
                    <li class="nav-item">
                        <a sec:authorize="isAuthenticated()" th:href="@{/organisasi/tree}" class="nav-link">
                            <i class="bi bi-diagram-3 me-1"></i>Struktur Organisasi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a sec:authorize="isAuthenticated()" th:href="@{/ganti-password}" class="nav-link">
                            <i class="bi bi-key me-1"></i>Ganti Password
                        </a>
                    </li>

                    <!-- Dark Mode Toggle -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <button id="darkModeToggle" class="nav-link btn btn-link" type="button"
                                title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
                            <i class="bi bi-moon-fill" id="darkModeIcon"></i>
                        </button>
                    </li>

                    <!-- User info & logout -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i>
                            <span th:text="${#authentication.name}">user</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item">
                                        <i class="bi bi-box-arrow-right me-1"></i>Keluar
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
</header>

    <!-- Dark Mode Toggle Script -->
    <script>
        (function() {
            'use strict';

            var htmlEl = document.documentElement;
            var STORAGE_KEY = 'sitandi-theme';

            function getPreferredTheme() {
                var stored = localStorage.getItem(STORAGE_KEY);
                if (stored === 'dark' || stored === 'light') {
                    return stored;
                }
                // Default to light if not set
                return 'light';
            }

            function setTheme(theme) {
                htmlEl.setAttribute('data-bs-theme', theme);
                localStorage.setItem(STORAGE_KEY, theme);
                // Update icon if toggle button exists
                var icon = document.getElementById('darkModeIcon');
                if (icon) {
                    if (theme === 'dark') {
                        icon.className = 'bi bi-sun-fill';
                    } else {
                        icon.className = 'bi bi-moon-fill';
                    }
                }
            }

            // Apply saved theme on page load
            setTheme(getPreferredTheme());

            // Setup toggle button listener after DOM ready
            document.addEventListener('DOMContentLoaded', function() {
                var toggleBtn = document.getElementById('darkModeToggle');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', function() {
                        var current = htmlEl.getAttribute('data-bs-theme') || 'light';
                        var next = current === 'dark' ? 'light' : 'dark';
                        setTheme(next);
                    });
                }
            });
        })();
    </script>

    <!--
      Brand-only alternative for app-sidebar (small logo area at top of sidebar).
      See sidebar.html for the sidebar fragment.
    -->
    <th:block th:fragment="sidebar-brand">
        <a th:href="@{/admin/dashboard}" class="brand-link">
            <img th:src="@{/images/logo-tu.svg}" alt="Logo TU" class="brand-image me-2"
                 style="height: 32px; width: 32px;">
            <span class="brand-text fw-bold">SITANDI</span>
        </a>
    </th:block>
</body>
</html>
